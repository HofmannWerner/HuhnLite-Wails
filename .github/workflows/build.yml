name: Build HuhnLite-Wails

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Add Go bin to PATH (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Add Go bin to PATH (Windows)
        if: matrix.os == 'windows-latest'
        run: echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Wails Doctor Diagnostics
        run: wails doctor || true

      - name: Build Application (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./buildall.ps1

      - name: Build Application (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          chmod +x build_all.sh
          ./build_all.sh

      - name: Package Release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/* -DestinationPath HuhnLite-Wails-Windows.zip -Force

      - name: Package Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          zip -r HuhnLite-Wails-Linux.zip build/bin/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HuhnLite-Wails-${{ matrix.os }}
          path: |
            *.zip
