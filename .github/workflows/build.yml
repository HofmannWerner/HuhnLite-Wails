name: Build HuhnLite-Wails

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, windows-latest, macos-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH (Linux & macOS)
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest'
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Add Go bin to PATH (Windows)
        if: matrix.os == 'windows-latest'
        run: echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Wails Doctor Diagnostics
        run: wails doctor || true

      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Application (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./buildall.ps1

      - name: Build Application (Linux & macOS)
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest'
        shell: bash
        run: |
          chmod +x build_all.sh
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Build for macOS Intel (amd64)
            ./build_all.sh darwin/amd64
            mkdir -p build/intel
            mv build/bin/* build/intel/
            
            # Build for macOS Apple Silicon (arm64)
            ./build_all.sh darwin/arm64
            mkdir -p build/silicon
            mv build/bin/* build/silicon/
          else
            # Linux Build
            ./build_all.sh
          fi

      - name: Package Release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/* -DestinationPath HuhnLite-Wails-Windows.zip -Force

      - name: Package Release (Linux & macOS)
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Build Intel ZIP and move DMGs
            cd build/intel
            zip -r ../../HuhnLite-Wails-macOS-Intel.zip .
            cd ../../
            mv build/intel/HuhnLite-Local.dmg HuhnLite-Local-macOS-Intel.dmg
            mv build/intel/HuhnLite-MariaDB.dmg HuhnLite-MariaDB-macOS-Intel.dmg
            mv build/intel/HuhnLite-Server.dmg HuhnLite-Server-macOS-Intel.dmg
            mv build/intel/HuhnLite-Server-MariaDB.dmg HuhnLite-Server-MariaDB-macOS-Intel.dmg

            # Build Silicon ZIP and move DMGs
            cd build/silicon
            zip -r ../../HuhnLite-Wails-macOS-Silicon.zip .
            cd ../../
            mv build/silicon/HuhnLite-Local.dmg HuhnLite-Local-macOS-Silicon.dmg
            mv build/silicon/HuhnLite-MariaDB.dmg HuhnLite-MariaDB-macOS-Silicon.dmg
            mv build/silicon/HuhnLite-Server.dmg HuhnLite-Server-macOS-Silicon.dmg
            mv build/silicon/HuhnLite-Server-MariaDB.dmg HuhnLite-Server-MariaDB-macOS-Silicon.dmg
          else
            zip -r HuhnLite-Wails-${{ matrix.os }}.zip build/bin/
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HuhnLite-Wails-${{ matrix.os }}
          path: |
            *.zip
            *.dmg
