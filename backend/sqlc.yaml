version: "2"
sql:
  - engine: "sqlite"
    queries: "db/queries.sql"
    schema: "db/schema_sqlite.sql"
    gen:
      go:
        package: "repo"
        out: "db/repo"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true
        overrides:
          - db_type: "char"
            go_type: "string"
          - db_type: "CHAR"
            go_type: "string"
          - db_type: "varchar"
            go_type: "string"
          - db_type: "VARCHAR"
            go_type: "string"
          - db_type: "text"
            go_type: "string"
          - db_type: "TEXT"
            go_type: "string"
          - db_type: "decimal"
            go_type: "float64"
          - db_type: "DECIMAL"
            go_type: "float64"
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "NUMERIC"
            go_type: "float64"

